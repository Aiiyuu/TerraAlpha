<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <title>Terra Alpha</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css"
    />

    <link rel="stylesheet" href="./src/styles/style.css" />
  </head>

     <script src="./src/dice.js" type="module"></script>

  <body class="section">
    <!-- Header / Clock -->
    <header class="has-text-centered mb-5">
      <div
        class="box has-background-black has-text-danger has-text-weight-bold is-size-1"
        data-qa="clock"
      >
        00:59
      </div>
    </header>

    <main class="columns is-variable is-6">

      <!-- DICE -->
      <div id="dice-overlay" style="display:none;">
      <div id="dice-popup"></div>
      </div>

      <!-- PLAYER 1 -->
      <section class="column has-text-centered" id="player1">
        <h2 class="title is-4 has-text-white has-text-outline">PLAYER 1</h2>

        <div class="field has-addons is-justify-content-center mb-4">
          <div class="control is-expanded">
            <input
              class="input"
              type="text"
              placeholder="Вибрати повідомлення"
              data-qa="p1-name"
            />
          </div>
          <div class="control">
            <button class="button is-light" data-qa="p1-avatar">*</button>
          </div>
        </div>

        <div class="chat mb-5">
          <div class="bubble is-red" data-qa="p1-chat"></div>
        </div>

        <div class="hand-grid mx-auto" data-qa="p1-hand">
          <button class="cell-btn" data-qa="p1-cell-1"></button>
          <button class="cell-btn" data-qa="p1-cell-2"></button>
          <button class="cell-btn" data-qa="p1-cell-3"></button>
          <button class="cell-btn" data-qa="p1-cell-4"></button>
          <button class="cell-btn" data-qa="p1-cell-5"></button>
          <button class="cell-btn" data-qa="p1-cell-6"></button>
          <button class="cell-btn" data-qa="p1-cell-7"></button>
          <button class="cell-btn" data-qa="p1-cell-8"></button>
        </div>
      </section>

      <!-- BOARD -->
      <section class="column is-narrow has-text-centered">
        <div class="board-grid" data-qa="board">
          <div class="cell square grey" data-qa="r1c1">
            <span class="corner-text">15</span>
          </div>
          <div class="cell square grey" data-qa="r1c2">
            <span class="corner-text">14</span>
          </div>
          <div class="cell square grey" data-qa="r1c3">
            <span class="corner-text">13</span>
          </div>
          <div class="cell circle red"  data-qa="r1c4"></div>
          <div class="cell square grey" data-qa="r1c5">
            <span class="corner-text">11</span>
          </div>
          <div class="cell square grey" data-qa="r1c6">
            <span class="corner-text">10</span>
          </div>
          <div class="cell square grey" data-qa="r1c7">
            <span class="corner-text">9</span>
          </div>

          <div class="cell square grey" data-qa="r2c1">
            <span class="corner-text">16</span>
          </div>
          <div class="cell empty"       data-qa="r2c2"></div>
          <div class="cell empty"       data-qa="r2c3"></div>
          <div class="cell square white"data-qa="r2c4"></div>
          <div class="cell empty"       data-qa="r2c5"></div>
          <div class="cell empty"       data-qa="r2c6"></div>
          <div class="cell square grey" data-qa="r2c7">
            <span class="corner-text">8</span>
          </div>

          <div class="cell square grey" data-qa="r3c1">
            <span class="corner-text">17</span>
          </div>
          <div class="cell empty"       data-qa="r3c2"></div>
          <div class="cell empty"       data-qa="r3c3"></div>
          <div class="cell square white"data-qa="r3c4"></div>
          <div class="cell empty"       data-qa="r3c5"></div>
          <div class="cell empty"       data-qa="r3c6"></div>
          <div class="cell square grey" data-qa="r3c7">
            <span class="corner-text">7</span>
          </div>

          <div class="cell circle red"  data-qa="r4c1"></div>
          <div class="cell square white"data-qa="r4c2"></div>
          <div class="cell square white"data-qa="r4c3"></div>
          <div class="cell square white"data-qa="r4c4"></div>
          <div class="cell square white"data-qa="r4c5"></div>
          <div class="cell square white"data-qa="r4c6"></div>
          <div class="cell circle red"  data-qa="r4c7"></div>

          <div class="cell square grey" data-qa="r5c1">
            <span class="corner-text">19</span>
          </div>
          <div class="cell empty"       data-qa="r5c2"></div>
          <div class="cell empty"       data-qa="r5c3"></div>
          <div class="cell circle white"data-qa="r5c4"></div>
          <div class="cell empty"       data-qa="r5c5"></div>
          <div class="cell empty"       data-qa="r5c6"></div>
          <div class="cell square grey" data-qa="r5c7">
            <span class="corner-text">5</span>
          </div>

          <div class="cell square grey" data-qa="r6c1">
            <span class="corner-text">20</span>
          </div>
          <div class="cell empty"       data-qa="r6c2"></div>
          <div class="cell empty"       data-qa="r6c3"></div>
          <div class="cell circle white"data-qa="r6c4"></div>
          <div class="cell empty"       data-qa="r6c5"></div>
          <div class="cell empty"       data-qa="r6c6"></div>
          <div class="cell square grey" data-qa="r6c7">
            <span class="corner-text">4</span>
          </div>

          <div class="cell square grey" data-qa="r7c1">
            <span class="corner-text">21</span>
          </div>
          <div class="cell square grey" data-qa="r7c2">
            <span class="corner-text">22</span>
          </div>
          <div class="cell square grey" data-qa="r7c3">
            <span class="corner-text">23</span>
          </div>
          <div class="cell circle white"data-qa="r7c4"></div>
          <div class="cell square grey" data-qa="r7c5">
            <span class="corner-text">1</span>
          </div>
          <div class="cell square grey" data-qa="r7c6">
            <span class="corner-text">2</span>
          </div>
          <div class="cell square grey" data-qa="r7c7">
            <span class="corner-text">3</span>
          </div>
        </div>

        <div class="buttons is-centered mt-4">
          <button class="button is-danger" data-qa="end-turn">Пoходити№1</button>
          <button class="button is-info" data-qa="start-turn">Походити№2</button>
        </div>

        <div class="buttons is-centered mt-4">
          <button class="button is-danger" id="roll1">КИНУТИ-№1</button>
          <button class="button is-info" id="roll2">КИНУТИ-№2</button>
        </div>
      </section>

      <section class="column has-text-centered" id="player2">
        <h2 class="title is-4 has-text-white has-text-outline">PLAYER 2</h2>

        <div class="field has-addons is-justify-content-center mb-4">
          <div class="control is-expanded">
            <input
              class="input"
              type="text"
              placeholder="Вибрати повідомлення"
              data-qa="p2-name"
            />
          </div>
          <div class="control">
            <button class="button is-light" data-qa="p2-avatar">*</button>
          </div>
        </div>

        <div class="chat mb-5">
          <div class="bubble is-blue" data-qa="p2-chat"></div>
        </div>

        <div class="hand-grid mx-auto" data-qa="p2-hand">
          <button class="cell-btn" data-qa="p2-cell-1"></button>
          <button class="cell-btn" data-qa="p2-cell-2"></button>
          <button class="cell-btn" data-qa="p2-cell-3"></button>
          <button class="cell-btn" data-qa="p2-cell-4"></button>
          <button class="cell-btn" data-qa="p2-cell-5"></button>
          <button class="cell-btn" data-qa="p2-cell-6"></button>
          <button class="cell-btn" data-qa="p2-cell-7"></button>
          <button class="cell-btn" data-qa="p2-cell-8"></button>
        </div>
      </section>
    </main>
  </body>
</html>
