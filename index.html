  <body>
    <header id="home" class="header">
      <div class="header-wrapper">
        <h1 class="header-title">Terra Alpha</h1>

        <div class="header-quick-actions">
          <button
            id="header-lng-btn"
            class="btn btn--purple btn--icon"
            aria-label="Language"
          ></button>
        </div>

        <div class="form-field form-field--floating">
          <input
            type="text"
            id="player-name"
            class="form-field-input"
            placeholder=" "
          />
          <label
            for="player-name"
            class="form-field-label"
            data-lng="playerNameInput"
          ></label>
        </div>

        <div class="form-field form-field-color">
          <h4 class="form-field-label" data-lng="playerColorInput"></h4>
          <div id="color-palette"></div>
        </div>

        <div id="avatars" class="avatars">
          <h4 class="form-field-label" data-lng="playerAvatarInput"></h4>
          <div id="avatar-menu"></div>
        </div>

        <div class="header-button-group">
          <button
            id="navigation-fast-game-btn"
            class="btn btn--purple"
            data-lng="fastGameBtn"
          ></button>
          <button
            id="navigation-select-room-btn"
            class="btn btn--purple"
            data-lng="selectRoomBtn"
          ></button>
          <button
            id="navigation-create-room-btn"
            class="btn btn--purple"
            data-lng="createRoomBtn"
          ></button>
        </div>

        <div class="gchat-wrapper">
          <div class="gchat" aria-label="Global chat input">
            <input
              type="text"
              id="gchat-message"
              class="gchat__message"
              placeholder="Type a message…"
              minlength="1"
              maxlength="40"
              required
            />
            <button id="gchat-send" class="gchat__send btn btn--dark">
              Send
            </button>
          </div>

          <div
            class="gchat-log"
            id="gchat-log"
            aria-live="polite"
            aria-label="Chat messages"
          >
            <ul class="gchat-log__list" id="gchat-log-list"></ul>
          </div>
        </div>
      </div>

      <div class="astronaut"></div>
      <div class="planet-1"></div>
      <div class="comet"></div>
    </header>

    <main>
      <section id="form-section" class="form-section is-hidden">
        <div class="decorations">
          <div class="rocket"></div>
          <div class="star"></div>
        </div>

        <form id="form" class="form-wrapper">
          <div class="form">
            <a href="#" class="form-brand" data-lng="logo"></a>

            <div class="form-field-group">
              <div id="room-field" class="form-field form-field--floating">
                <input
                  type="text"
                  id="room-name"
                  class="form-field-input"
                  placeholder=" "
                />

                  for="room-name"
                  class="form-field-label"
                  data-lng="roomNameInput"

              </div>
            </div>

            <div id="table"></div>

          <button
            type="submit"
            id="create-room-btn"
            class="btn btn--purple"
            data-lng="createRoomBtn"
          ></button>
          <button
            type="button"
            id="back-to-home"
            class="btn btn--purple"
            data-lng="backToHomePageBtn"
          ></button>
        </form>
      </section>
